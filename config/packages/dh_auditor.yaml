# Every auditor-bundle option is listed here: the ones the demo uses are active,
# the others are commented out with an example value.
dh_auditor:
    enabled: true
    timezone: 'Europe/Paris'
    # user_provider: 'dh_auditor.user_provider'          # service resolving the current user (blame)
    # security_provider: 'dh_auditor.security_provider'  # service resolving IP and firewall
    # role_checker: 'dh_auditor.role_checker'            # service deciding who can view audits
    # extra_data_provider: ~                             # service adding extra_data to each entry

    providers:
        doctrine:
            # table_prefix: ''
            table_suffix: '_audit'

            # Doctrine *property* names (not SQL column names), ignored for every entity.
            # The demo ignores createdAt/updatedAt with #[Audit\Ignore] on the entities instead.
            # ignored_columns:
            #     - createdAt
            #     - updatedAt

            full_snapshot_on_remove: true    # store every field value in REMOVE entries

            # Label of an entity written in the diffs ("Jane’s comment" rather than "Comment #12 by Jane")
            entity_label_resolver: App\Audit\EntityLabelResolver
            # root_resolver: ~               # service returning extra audit roots of an object
            # read_scope: ~                  # service restricting every query of the reader (multi-tenancy…)
            # batch_size: 0                  # multi-row INSERTs for audit entries (0: one INSERT per entry)
            # compression: false             # compress the diffs/extra_data columns (MariaDB only)
            # skip_disabled_entities: false  # no audit table for entities disabled by their configuration
            # ignored_columns_resolver: ~    # service returning the properties to ignore for an object
            # utf8_convert: false            # legacy mb_convert_encoding() pass (opt-in)

            # Auditable entities are declared with #[Audit\Auditable]; YAML can declare them too
            # and add per-entity options. The demo only restricts who can read the audits: the post and
            # author pages are public, their history (<twig:DhAuditor:History>, dh_auditor_last_changes())
            # is shown to signed-in users only, as the viewer and /history are.
            entities:
                App\Entity\Author:
                    roles: { view: [ROLE_USER] }
                App\Entity\Post:
                    roles: { view: [ROLE_USER] }
                App\Entity\Comment:
                    roles: { view: [ROLE_USER] }
                App\Entity\Tag:
                    roles: { view: [ROLE_USER] }

            # Other per-entity options:
            # entities:
            #     App\Entity\Post:
            #         roots: [author]          # same as #[Audit\AuditRoot('author')]
            #         ignored_columns: [excerpt]
            #         audited_columns: [title, status]   # allowlist (ignoring always wins)
            #         roles:
            #             view: [ROLE_ADMIN]
            #         retention:
            #             max_age: 'P1Y'       # ISO 8601 duration, applied by audit:clean
            #             max_entries: 500

            storage_services:
                - '@doctrine.orm.default_entity_manager'
            # auditing_services:
            #     - '@doctrine.orm.default_entity_manager'
            # storage_mapper: ~              # required with several storage services

            viewer:
                enabled: true
                page_size: 25

            # Scheduled pruning (needs symfony/scheduler, symfony/messenger, dragonmantank/cron-expression)
            # retention:
            #     schedule: '0 3 * * *'
            #     default_max_age: 'P2Y'
